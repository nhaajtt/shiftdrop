[package]
name = "shiftdrop"
version = "1.0.1"
edition = "2021"

[lib]
name = "shiftdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
image = "0.25"
webp = "0.3"
base64 = "0.22"
sha2 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
oxipng = { version = "9", default-features = false, features = ["parallel"] }
pdfium-render = "0.9"
md-5 = "0.10"
sha1 = "0.10"
infer = "0.19"
age = "0.11"
serde_yaml = "0.9"
toml = "0.8"
quick-xml = "0.37"
similar = "2"
qrcode = { version = "0.14", default-features = false, features = ["image", "svg"] }
rqrr = "0.9"
vtracer = "0.6"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "std"] }
tauri-plugin-drag = "2.1.1"
getrandom = "0.3"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  "Win32_System_RestartManager",
  "Win32_Storage_FileSystem",
] }
windows = { version = "0.62", features = [
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_WinRT",
  "Foundation",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage",
  "Storage_Streams",
  "Globalization",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
