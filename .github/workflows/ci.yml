# Checks that every push builds. Releases are built and signed locally, so no signing key
# is stored on GitHub.
name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['website/**', 'docs/**', 'film/**', '**.md']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Known vulnerabilities in packages the app ships
        run: npm audit --omit=dev

      - name: Build web UI
        run: npm run build

      - name: PDF engine
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1

      - name: FFmpeg for the engine tests
        run: choco install ffmpeg -y --no-progress

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Engine tests
        working-directory: src-tauri
        run: cargo test --lib --locked

  # RustSec advisories for every crate in Cargo.lock
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        working-directory: src-tauri
        run: cargo audit
